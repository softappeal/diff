[versions]

kotlin     = "2.4.21"     # https://github.com/JetBrains/kotlin
coroutines = "1.11.0"     # https://github.com/Kotlin/kotlinx.coroutines
yass2      = "31.0.0"     # https://github.com/softappeal/yass2
ksp        = "2.3.13"     # https://github.com/google/ksp
boot       = "4.1.2"      # https://github.com/spring-projects/spring-boot

[libraries]

coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

yass2-serialize = { module = "ch.softappeal.yass2:yass2-serialize", version.ref = "yass2" }
yass2-generate  = { module = "ch.softappeal.yass2:yass2-generate" , version.ref = "yass2" }

[plugins]

jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
boot = { id = "org.springframework.boot", version.ref = "boot" }
