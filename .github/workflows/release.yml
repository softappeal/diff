on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: |
          ./kotlin test
          ./kotlin package
      - name: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/tasks/_diff_executableJarJvm/diff-jvm-executable.jar diff.jar
          gh release create `git describe` diff.jar
