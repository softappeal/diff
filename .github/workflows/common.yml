#file: noinspection SpellCheckingInspection
on:
  workflow_call:
    inputs:
      run:
        type: string
        required: true
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25.0.5'
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo $JAVA_HOME
          java --version
          ${{ inputs.run }}
